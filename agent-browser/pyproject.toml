[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-browser"
version = "0.2.0"
description = "Drive a real, visible Edge/Chrome window from a shell: a Playwright CLI with JSON output built for small AI models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # The engine. aria_snapshot(mode="ai") and the aria-ref selector engine appeared in 1.5x and are
    # what Playwright MCP uses; TESTED_PLAYWRIGHT in agent_browser_core/common.py names verified lines.
    # The upper bound is the newest tested line (PLAYWRIGHT_REQUIREMENT there, checked by tests/test_packaging.py):
    # the snapshot text and error messages this tool reads are not a versioned interface. Raise it only after the
    # live suite passes on the newer line.
    "playwright>=1.61,<1.66",
]

[project.optional-dependencies]
dev = ["pytest>=9"]
mcp = ["mcp>=1.29,<2"]

[project.scripts]
agent-browser = "agent_browser:main"
agent-browser-mcp = "agent_browser_core.mcp_server:main"

[tool.setuptools]
py-modules = ["agent_browser"]
packages = ["agent_browser_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a real Edge/Chrome and Playwright; run with AGENT_BROWSER_LIVE=1 python -m pytest -m live"]
addopts = "-m 'not live'"
