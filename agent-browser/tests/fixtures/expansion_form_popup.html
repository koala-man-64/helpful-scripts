<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Form popup regression</title></head>
<body><script>
if (location.search) {
  document.body.innerHTML = '<label for="second">Second</label><input id="second">';
} else {
  document.body.innerHTML = '<label for="first">First</label><input id="first" type="checkbox">' +
    '<iframe title="Form fields" src="?frame=1"></iframe>';
  document.querySelector('#first').addEventListener('change', () => window.open('?popup=1', 'form-popup'));
}
</script></body></html>
