<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Inner fixture</title>
</head>
<body>
  <h2>Inner form</h2>
  <label for="caller">Caller</label>
  <input id="caller" type="text" value="">
  <button id="save">Save</button>
  <button id="reload">Reload frame</button>
  <button id="navigate">Navigate frame</button>
  <p id="saved"></p>
  <script>
    document.getElementById('save').addEventListener('click', function () {
      document.getElementById('saved').textContent = 'saved:' + document.getElementById('caller').value;
    });
    document.getElementById('reload').addEventListener('click', function () { location.reload(); });
    document.getElementById('navigate').addEventListener('click', function () { location.href = 'inner.html?nav=1'; });
  </script>
</body>
</html>
