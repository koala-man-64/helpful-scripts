<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Downloads</title>
</head>
<body>
  <h1>Downloads</h1>
  <a id="small" href="data:text/plain,hello%20world" download="hello.txt">Download small</a>
  <button id="big">Download big</button>
  <p id="done"></p>
  <script>
    document.getElementById('big').addEventListener('click', function () {
      var blob = new Blob([new Uint8Array(20 * 1024 * 1024)]);
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'big.bin';
      a.click();
      document.getElementById('done').textContent = 'started';
    });
  </script>
</body>
</html>
